<script>
/* Temporary real-device PWA diagnostic: capture install prompt as early as possible. */
window.__mlwBIP = null;
window.__mlwDiag = [];
window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault();
  window.__mlwBIP = e;
  window.__mlwDiag.push({ t:'bip_received', at:Date.now() });
  if (window.__mlwBIPShow) window.__mlwBIPShow();
});
window.addEventListener('appinstalled', function () {
  window.__mlwBIP = null;
  window.__mlwDiag.push({ t:'appinstalled', at:Date.now() });
  if (window.render) window.render();
});
</script>

if ('serviceWorker' in navigator) {

}
</script>
